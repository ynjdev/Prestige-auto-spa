# ─── Clipper config ───────────────────────────────────────────────────────────

[you]
# Platforms you post on
platforms = ["tiktok", "instagram", "youtube"]
# Views one of your clips USUALLY gets. This drives the profit estimate:
# campaigns whose minimum payout needs more views than this are skipped.
typical_views = 3000
# How many clips you post a day (the tutorial says ~10 good clips a day)
clips_per_day = 10
# Count earnings from posting the same clip on every platform the campaign pays on
cross_post = true
# How much your views swing from clip to clip (1.0 = normal for short-form:
# most clips near typical_views, some 3-10x more, some far less)
views_spread = 1.0

[campaigns]
# Skip anything paying less than this per 1,000 views
min_rate_per_1k = 0.50
# Skip campaigns with less budget left than this ($)
min_budget_left = 300
# The tutorial's rule: go for a LOW minimum payout. Skip a campaign when fewer than
# this share of your clips would get enough views to reach its minimum payout.
min_chance_paid = 0.4
# Budget left ($) / days of budget left at which a campaign stops being penalised
comfortable_budget = 2000
comfortable_days = 7
skip_not_accepting = true
# When you send a page that lists many campaigns, open at most this many
max_links_from_listing = 40
# The ranking keeps every campaign you've sent in this many hours (resend a link to refresh it)
keep_hours = 24

[clips]
# Clips to make per campaign brief
per_campaign = 10
# Used when the brief doesn't say how long clips must be
min_sec = 15
max_sec = 60
# "blur" = whole frame on a blurred background (safe for anything)
# "crop" = fill the screen, cuts off the sides
reframe = "blur"
# Burn subtitles into the video (an .srt file is always made either way)
burn_subtitles = false

[ai]
# Claude picks the best moments (needs ANTHROPIC_API_KEY). Off = loudness/talk heuristic.
use_claude = true
model = "claude-opus-5-5"
# Local speech-to-text model: tiny.en, base.en, small.en (slower, more accurate)
whisper = "base.en"
threads = 4

[download]
# Set to "chrome", "firefox", "safari" or "edge" if downloads need you logged in
cookies_from_browser = ""
cookies_file = ""
max_videos_per_link = 10
