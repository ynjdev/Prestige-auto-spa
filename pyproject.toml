[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipper"
version = "0.1.0"
description = "Whop Content Rewards clipper: rank campaigns by profit, turn briefs into ready-to-post clips."
requires-python = ">=3.11"
dependencies = [
  "yt-dlp>=2025.1.1",
  "python-docx>=1.1",
  "requests>=2.31",
  "numpy>=1.26",
  "sherpa-onnx>=1.10",
  "playwright>=1.45",
  "anthropic>=1.0",
  "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
clipper = "clipper.cli:main"

[tool.setuptools]
packages = ["clipper"]
