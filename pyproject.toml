[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipper"
version = "0.1.0"
description = "Whop Content Rewards clip pipeline: ingest submission docs, enforce rules, ban, rank, and collect ready-to-post clips."
requires-python = ">=3.11"
dependencies = [
  "yt-dlp>=2025.1.1",
  "openpyxl>=3.1",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
clipper = "clipper.cli:main"

[tool.setuptools]
packages = ["clipper"]
